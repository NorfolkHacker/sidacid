[workspace]
resolver = "3"
members = ["crates/sid-core", "crates/acid-engine", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
ron = "0.8"
hound = "3.5"
rtrb = "0.3"
eframe = { version = "0.31", default-features = false, features = ["glow", "wayland", "x11", "default_fonts"] }
cpal = "0.15"
rfd = "0.15"
rand = "0.8"
rand_pcg = "0.3"
symphonia = { version = "0.5", default-features = false, features = ["wav", "pcm", "flac", "mp3", "ogg", "vorbis"] }
flate2 = "1"
memory-stats = "1.2"
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
base64 = "0.22"

# Audio tests render seconds of sound; unoptimised builds are too slow.
[profile.dev]
opt-level = 2
